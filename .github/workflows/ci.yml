# The arena CI (the Jelby E.7 live gate, retired to on-demand): ONE seeded fixture per run. Merging
# the Jelby fix PR for the target makes main green. On failure, the FAILED_TEST::<file> marker is
# emitted for Jelby's poll (the default JELBY_CI_MARKER). GitHub-hosted runner.
name: CI
on:
  push:
    branches: [main]  # main-only: fix-PR branches must not re-run the seeded harness (or re-mint fixes)
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: vitest (seeded target)
        run: |
          if npx vitest run celsius-to-f.test.ts; then
            echo "seeded target passes"
          else
            echo "FAILED_TEST::celsius-to-f.test.ts"
            exit 1
          fi
